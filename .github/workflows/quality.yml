name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Rust 1.98.1 with the browser target
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Validate the locked Rust adapter
        run: |
          cargo fmt --manifest-path crates/neuromorphic-adapter/Cargo.toml --check
          cargo clippy --manifest-path crates/neuromorphic-adapter/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path crates/neuromorphic-adapter/Cargo.toml --locked
          cargo check --manifest-path crates/neuromorphic-adapter/Cargo.toml --locked --target wasm32-unknown-unknown
      - name: Enforce browser dependency policy
        run: node scripts/verify-browser-dependencies.mjs
      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Smoke-test generated Rust/WASM bindings
        run: WASM_BINDGEN_BIN="$(command -v wasm-bindgen)" npm run test:wasm-adapter
      - name: Smoke-test the generated adapter in Chrome
        run: BROWSER_BIN="$(command -v google-chrome)" WASM_BINDGEN_BIN="$(command -v wasm-bindgen)" npm run test:wasm-browser
      - name: Validate site
        run: npm run validate
